[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfhir"
version = "0.1.0"
description = "Production-ready Python FHIR framework."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Emil Thomas"}]
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
